[package]
name = "pingtray"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
eframe = "0.36.2"
egui_plot = "0.37.0"
ksni = "0.3.6"
png = "0.18.1"
quick-xml = "0.42.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
surge-ping = "0.9.1"
tiny_http = "0.12.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3.4.2"
walkers = "0.61.0"
